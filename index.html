<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metric / Imperial Converter</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  </head>
  <body >
    <header >
      <div >
        <h1 >Unit Converter</h1>
        <p >Metric and Imperial Unit Conversion</p>
      </div>
      <div>
        <button type="button" id="weightTab">Weight</button>
        <button type="button" id="distanceTab">Distance</button>
        <button type="button" id="temperatureTab">Temperature</button>
      </div>
    </header>

    <main >
      <section>
        <h2 ></h2>
        <p >Type one number or a comma-separated list, then press Convert.</p>

        <div >
          <h3 id="imperialToMetricTitle"></h3>
          <div >
            <div >
              <label id="imperialToMetricLabelIn" for="imperialToMetricInput" ></label>
              <input id="imperialToMetricInput" type="text" value="" />
            </div>
            <button id="imperialToMetricButton" type="button" >Convert</button>
            <div class="w-full">
              <label id="imperialToMetricLabelOut" for="imperialToMetricOutput" ></label>
              <input id="imperialToMetricOutput" type="text" readonly value="" />
            </div>
          </div>

          <h3 id="metricToImperialTitle"></h3>
          <div >
            <div >
              <label id="metricToImperialLabelIn" for="metricToImperialInput" ></label>
              <input id="metricToImperialInput" type="text" value="" />
            </div>
            <button id="metricToImperialButton" type="button" >Convert</button>
            <div >
              <label id="metricToImperialLabelOut" for="metricToImperialOutput" ></label>
              <input id="metricToImperialOutput" type="text" readonly value=""/>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer >
      <div >
        <p class="text-sm text-slate-500">CPRG 306 Assignment 1 - Tailwind CSS and TypeScript</p>
      </div>
    </footer>

    <script src="./main.js"></script>
</html>
